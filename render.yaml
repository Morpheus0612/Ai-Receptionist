services:
  # Backend FastAPI Web Service
  - type: web
    name: ai-receptionist-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/seed_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./receptionist.db
      - key: GEMMA_MODEL_NAME
        value: gemma-2-9b-it
      - key: USE_DEMO_CALENDAR
        value: "true"

  # Frontend React Static Site
  - type: static
    name: ai-receptionist-dashboard
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
